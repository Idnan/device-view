<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 320px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  h2 { margin: 0 0 -4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* Current-device card: yellow while a view is on. */
  .hero { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 2px solid var(--ink);
          border-radius: 12px; background: var(--card); box-shadow: 4px 4px 0 var(--ink); }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  #meta { font-size: 14px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hero-row { display: flex; gap: 6px; }
  .hero.live { background: var(--yellow); color: var(--on-yellow); }
  .hero.live .btn, .hero.live .seg { background: #fff; color: #0a0a0a; border-color: #0a0a0a; }

  .seg { flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid var(--ink);
         border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { height: 28px; border: 0; background: none; font-size: 11.5px; font-weight: 600; }
  .seg button + button { border-left: 2px solid currentColor; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .hero.live .seg button[aria-pressed="true"] { background: #0a0a0a; color: #fff; }

  #devices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .device { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; padding: 7px 10px;
            border: 2px solid var(--ink); border-radius: 10px; background: var(--card); text-align: left;
            transition: transform .08s, box-shadow .08s; }
  .device:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
  .device b { max-width: 100%; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device small { font-size: 11.5px; font-weight: 500; color: var(--muted); }
  .device[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }
  .device[aria-pressed="true"] small { color: #3d3d3d; }

  #custom { display: flex; align-items: center; gap: 6px; }
  .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 8px;
           border: 2px solid var(--ink); border-radius: 8px; background: var(--card); }
  .field span { font-size: 11px; font-weight: 700; color: var(--muted); }
  .field input { width: 100%; border: 0; background: none; outline: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .field input::-webkit-inner-spin-button { display: none; }
  .touch { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; }
  .touch input { margin: 0; accent-color: var(--ink); }

  .mode { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px;
          border: 2px solid var(--ink); border-radius: 10px; cursor: pointer; }
  .mode b { display: block; font-weight: 700; }
  .mode small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .mode input { appearance: none; flex: none; position: relative; width: 40px; height: 24px; margin: 0; cursor: pointer;
                border: 2px solid var(--ink); border-radius: 999px; background: var(--card); transition: background .12s; }
  .mode input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                        background: var(--ink); transition: transform .12s; }
  .mode input:checked { background: var(--yellow); }
  .mode input:checked::before { transform: translateX(16px); background: #0a0a0a; }
  .hero[aria-busy="true"] { cursor: progress; opacity: .75; }

  .primary { height: 42px; border: 2px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--paper);
             font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .primary svg { width: 14px; height: 14px; }
  #error { margin: 0; padding: 7px 9px; border: 2px solid var(--danger); border-radius: 8px; color: var(--danger); font-size: 12px; font-weight: 600; }
  #error:empty { display: none; }
</style>
</head>
<body>
  <header>
    <h1 class="display">DEVICE VIEW</h1>
    <button id="theme" class="btn icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section id="hero" class="hero">
    <div class="hero-top">
      <div>
        <div id="name" class="display">Off</div>
        <div id="meta" class="display">Pick a device below</div>
      </div>
      <button id="reset" class="btn icon-btn" aria-label="Turn off" title="Turn off" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
    <div class="hero-row">
      <button id="rotate" class="btn" disabled>Rotate</button>
      <div id="zoom" class="seg" role="group" aria-label="Zoom">
        <button data-zoom="0.5" disabled>50%</button>
        <button data-zoom="0.75" disabled>75%</button>
        <button data-zoom="1" disabled>100%</button>
        <button data-zoom="fit" disabled>Fit</button>
      </div>
    </div>
  </section>

  <p id="error" role="alert"></p>

  <div id="devices"></div>

  <h2 class="display">Custom</h2>
  <form id="custom">
    <label class="field"><span>W</span><input id="w" type="number" min="100" max="4000" placeholder="390" required></label>
    <label class="field"><span>H</span><input id="h" type="number" min="100" max="4000" placeholder="844" required></label>
    <label class="touch" title="Behave like a touch device (mobile user agent)"><input id="m" type="checkbox"> Touch</label>
    <button class="btn">Go</button>
  </form>

  <label class="mode">
    <span>
      <b>Full emulation</b>
      <small>Real touch, pixel density and user agent. Shows Chrome's debugging bar.</small>
    </span>
    <input id="full" type="checkbox" role="switch">
  </label>

  <button id="compare" class="primary display">
    <span id="compare-label">Compare all side by side</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
  </button>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
