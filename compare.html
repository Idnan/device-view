<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare · Device View</title>
<link rel="stylesheet" href="theme.css">
<style>
  header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           background: var(--paper); border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  #url { flex: 1; min-width: 0; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { display: flex; gap: 24px; padding: 24px 20px 40px; overflow-x: auto; align-items: flex-start; }
  figure { margin: 0; flex: none; display: flex; flex-direction: column; gap: 8px; }
  figcaption { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
  figcaption span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .frame { overflow: hidden; border: 2px solid var(--ink); border-radius: 12px; background: #fff; box-shadow: 4px 4px 0 var(--ink); }
  iframe { border: 0; transform-origin: 0 0; display: block; }
  #error { margin: 24px 20px; font-weight: 600; color: var(--danger); }
</style>
</head>
<body>
  <header>
    <h1 class="display">DEVICE VIEW · COMPARE</h1>
    <span id="url"></span>
    <button id="reload" class="btn">Reload all</button>
    <button id="theme" class="btn icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main id="frames"></main>
  <script src="shared.js"></script>
  <script src="compare.js"></script>
</body>
</html>
